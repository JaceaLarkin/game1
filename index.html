<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Little Dungeon</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">A tiny turn-based adventure</p><h1>Little Dungeon</h1></div><button id="new-game">New run</button></header>
<section class="hud"><div class="stat">HEALTH <strong id="health"></strong></div><div class="stat">DEPTH <strong id="depth"></strong></div><div class="stat">GOLD <strong id="gold"></strong></div><div class="stat">ATTACK <strong id="attack"></strong></div></section>
<section class="game-layout"><div class="board-wrap"><div id="board" aria-label="Dungeon map"></div></div><aside><h2>How to play</h2><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys. Every move gives monsters a turn.</p><p>Find gold <b class="gold-mark">$</b>, potions <b class="potion-mark">!</b>, and stairs <b class="stairs-mark">&gt;</b>.</p><div class="legend"><span>@ You</span><span class="goblin">g Goblin</span><span># Wall</span></div><h2>Adventure log</h2><ol id="log" aria-live="polite"></ol></aside></section><footer>Find the stairs. See how deep you can go.</footer></main><script src="game.js"></script></body></html>
